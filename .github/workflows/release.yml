name: Release

on:
  push:
    tags:
      - "v*"

# Default deny. Each job opts into the minimum it needs below.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for sigstore-backed provenance signatures.
      id-token: write
      # Required for actions/attest-build-provenance to record attestations
      # against the workflow run.
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # `rust-target` must agree with rustTripleFromTarget in build.zig and
        # with the fenix targets pulled by flake.nix. The Rust regex shim is
        # cross-compiled with cargo-zigbuild so release binaries ship with
        # regex enabled on every platform.
        include:
          - { target: x86_64-linux,    os: linux,   arch: amd64, ext: tar.gz, rust-target: x86_64-unknown-linux-musl }
          - { target: aarch64-linux,   os: linux,   arch: arm64, ext: tar.gz, rust-target: aarch64-unknown-linux-musl }
          - { target: x86_64-macos,    os: macos,   arch: amd64, ext: tar.gz, rust-target: x86_64-apple-darwin }
          - { target: aarch64-macos,   os: macos,   arch: arm64, ext: tar.gz, rust-target: aarch64-apple-darwin }
          - { target: x86_64-windows,  os: windows, arch: amd64, ext: zip,    rust-target: x86_64-pc-windows-gnu }
          - { target: aarch64-windows, os: windows, arch: arm64, ext: zip,    rust-target: aarch64-pc-windows-gnullvm }
          - { target: x86_64-freebsd,  os: freebsd, arch: amd64, ext: tar.gz, rust-target: x86_64-unknown-freebsd }
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: ./.github/actions/setup-rust-cross
        with:
          rust-target: ${{ matrix.rust-target }}

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dversion="$VERSION"

      - name: Package name
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=zq-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          set -euo pipefail
          mkdir staging
          cp LICENSE staging/
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp zig-out/bin/zq.exe staging/
            cd staging && zip "../${{ steps.meta.outputs.name }}.zip" zq.exe LICENSE
          else
            cp zig-out/bin/zq staging/
            tar -czf "${{ steps.meta.outputs.name }}.tar.gz" -C staging zq LICENSE
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.meta.outputs.name }}.${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.${{ matrix.ext }}
          retention-days: 1

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      # Required to create the GitHub release + upload assets.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum zq-* > checksums-sha256.txt

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: zq-sbom.cyclonedx.json
          output-file: artifacts/zq-sbom.cyclonedx.json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            install.ps1
            artifacts/zq-*.tar.gz
            artifacts/zq-*.zip
            artifacts/checksums-sha256.txt
            artifacts/zq-sbom.cyclonedx.json

      - name: Publish to PyPI
        if: "!contains(github.ref_name, '-')"
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          pip install twine
          VERSION="${GITHUB_REF_NAME#v}"
          bash pypi/publish.sh "$VERSION" artifacts

      - name: Update Homebrew tap
        if: "!contains(github.ref_name, '-')"
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: Enriquefft/homebrew-zq
          event-type: release
          client-payload: '{"version": "${{ github.ref_name }}"}'

  npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash npm/publish.sh "$VERSION" artifacts

  docker:
    name: Publish Docker
    runs-on: ubuntu-latest
    needs: [build]
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: zq-*-linux-*
          merge-multiple: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash docker/publish.sh "$VERSION" artifacts

  smoke-install:
    name: Smoke test installer (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: [release]
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  shell: bash, script: install.sh,  bin: zq,     install_dir: ~/.local/bin }
          - { runner: macos-latest,   shell: bash, script: install.sh,  bin: zq,     install_dir: ~/.local/bin }
          - { runner: windows-latest, shell: pwsh, script: install.ps1, bin: zq.exe, install_dir: '$env:LOCALAPPDATA\zq' }
    steps:
      # Allow up to ~60s for the freshly created release to propagate to the
      # GitHub releases CDN. install scripts hit /releases/download/<tag>/...
      # which can 404 in the first few seconds.
      - name: Wait for release CDN
        shell: bash
        run: sleep 45

      - name: Run installer (Unix)
        if: matrix.shell == 'bash'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/${{ matrix.script }}" \
            | sh -s -- --version "$VERSION"
          # install.sh appends ${{ matrix.install_dir }} to PATH via shell rc;
          # in CI we prepend it directly so the verify step resolves the binary.
          # `eval` resolves the leading `~` to $HOME.
          eval "echo ${{ matrix.install_dir }}" >> "$GITHUB_PATH"

      - name: Run installer (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          $ScriptUrl = "https://raw.githubusercontent.com/${{ github.repository }}/$env:GITHUB_REF_NAME/${{ matrix.script }}"
          $ScriptBlock = [scriptblock]::Create((Invoke-RestMethod -Uri $ScriptUrl))
          & $ScriptBlock -Version $VERSION
          # install.ps1 updates user PATH via SetEnvironmentVariable; that
          # change is not visible to the current process. Append manually.
          # Use Add-Content (no BOM, no encoding ambiguity across PS5/PS7).
          $InstallDir = "${{ matrix.install_dir }}"
          Add-Content -Path $env:GITHUB_PATH -Value $ExecutionContext.InvokeCommand.ExpandString($InstallDir)

      - name: Verify binary (Unix)
        if: matrix.shell == 'bash'
        run: |
          set -euo pipefail
          command -v ${{ matrix.bin }}
          ${{ matrix.bin }} --version
          echo '{"a":[1,2,3]}' | ${{ matrix.bin }} '.a | map(. * 2)'

      - name: Verify binary (Windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          (Get-Command ${{ matrix.bin }}).Source
          ${{ matrix.bin }} --version
          '{"a":[1,2,3]}' | ${{ matrix.bin }} '.a | map(. * 2)'

  aur:
    name: Update AUR
    runs-on: ubuntu-latest
    needs: [release]
    if: "!contains(github.ref_name, '-')"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prepare PKGBUILD
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/Enriquefft/zq/releases/download/v${VERSION}"

          curl -fsSL "${BASE}/checksums-sha256.txt" -o checksums.txt

          SHA_X86_64=$(grep "linux-amd64" checksums.txt | awk '{print $1}')
          SHA_AARCH64=$(grep "linux-arm64" checksums.txt | awk '{print $1}')

          cp dist/aur/PKGBUILD PKGBUILD
          sed -i "s/PKGVER_PLACEHOLDER/${VERSION}/" PKGBUILD
          sed -i "s/sha256sums_x86_64=('PLACEHOLDER')/sha256sums_x86_64=('${SHA_X86_64}')/" PKGBUILD
          sed -i "s/sha256sums_aarch64=('PLACEHOLDER')/sha256sums_aarch64=('${SHA_AARCH64}')/" PKGBUILD

          cat PKGBUILD

      - name: Generate .SRCINFO
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA_X86_64=$(grep "linux-amd64" checksums.txt | awk '{print $1}')
          SHA_AARCH64=$(grep "linux-arm64" checksums.txt | awk '{print $1}')

          printf 'pkgbase = zq-bin\n' > .SRCINFO
          printf '\tpkgdesc = A drop-in replacement for jq, 31x faster, written in Zig\n' >> .SRCINFO
          printf '\tpkgver = %s\n' "$VERSION" >> .SRCINFO
          printf '\tpkgrel = 1\n' >> .SRCINFO
          printf '\turl = https://github.com/Enriquefft/zq\n' >> .SRCINFO
          printf '\tarch = x86_64\n' >> .SRCINFO
          printf '\tarch = aarch64\n' >> .SRCINFO
          printf '\tlicense = MIT\n' >> .SRCINFO
          printf '\tprovides = zq\n' >> .SRCINFO
          printf '\tconflicts = zq\n' >> .SRCINFO
          printf '\tsource_x86_64 = https://github.com/Enriquefft/zq/releases/download/v%s/zq-%s-linux-amd64.tar.gz\n' "$VERSION" "$VERSION" >> .SRCINFO
          printf '\tsha256sums_x86_64 = %s\n' "$SHA_X86_64" >> .SRCINFO
          printf '\tsource_aarch64 = https://github.com/Enriquefft/zq/releases/download/v%s/zq-%s-linux-arm64.tar.gz\n' "$VERSION" "$VERSION" >> .SRCINFO
          printf '\tsha256sums_aarch64 = %s\n' "$SHA_AARCH64" >> .SRCINFO
          printf '\n' >> .SRCINFO
          printf 'pkgname = zq-bin\n' >> .SRCINFO

          cat .SRCINFO

      - name: Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF

          git clone ssh://aur@aur.archlinux.org/zq-bin.git aur-repo
          cp PKGBUILD aur-repo/PKGBUILD
          cp .SRCINFO aur-repo/.SRCINFO

          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes" && exit 0
          VERSION="${GITHUB_REF_NAME#v}"
          git commit -m "Update to ${VERSION}"
          git push
