name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-linux,   os: linux,   arch: amd64 }
          - { target: aarch64-linux,  os: linux,   arch: arm64 }
          - { target: x86_64-macos,   os: macos,   arch: amd64 }
          - { target: aarch64-macos,  os: macos,   arch: arm64 }
          - { target: x86_64-freebsd, os: freebsd, arch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Package name
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "name=zq-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir staging
          cp zig-out/bin/zq staging/
          tar -czf "${{ steps.meta.outputs.name }}.tar.gz" -C staging zq

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.tar.gz
          retention-days: 1

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: cd artifacts && sha256sum zq-* > checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/zq-*.tar.gz
            artifacts/checksums-sha256.txt
