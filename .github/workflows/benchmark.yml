name: Benchmark Regression
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode (regression = zq+jq fast; comparison = full suite)'
        required: true
        default: 'comparison'
        type: choice
        options:
          - regression
          - comparison
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

# Cancel in-progress runs only on PRs. Pushes to main must complete so the
# baseline cache stays in sync with the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BENCH_MODE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'comparison')) && 'comparison' || 'regression' }}
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Configure mode-dependent env
        run: |
          if [ "$BENCH_MODE" = "comparison" ]; then
            echo "HUGE_LINES=15000000"     >> "$GITHUB_ENV"
            # Wide records are ~12x larger per line than narrow records
            # (~960B vs ~80B), so HUGE_WIDE_LINES is scaled down to keep
            # the on-disk dataset size in the same ballpark as the narrow
            # one (~1.4 GB).
            echo "HUGE_WIDE_LINES=1500000" >> "$GITHUB_ENV"
            echo "ZQ_QUICK=0"              >> "$GITHUB_ENV"
          else
            echo "HUGE_LINES=1000000"      >> "$GITHUB_ENV"
            echo "HUGE_WIDE_LINES=100000"  >> "$GITHUB_ENV"
            echo "ZQ_QUICK=0"              >> "$GITHUB_ENV"
          fi

      - name: Install jq + hyperfine (always, pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc

          JQ_VERSION="1.7.1"
          curl -sSL "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64" -o /usr/local/bin/jq
          chmod +x /usr/local/bin/jq

          HYPERFINE_VERSION="1.18.0"
          curl -sSL "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          mv "hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl/hyperfine" /usr/local/bin/hyperfine
          chmod +x /usr/local/bin/hyperfine

      - name: Install jaq + gojq (comparison only, pinned)
        if: env.BENCH_MODE == 'comparison'
        run: |
          JAQ_VERSION="2.1.0"
          curl -sSL "https://github.com/01mf02/jaq/releases/download/v${JAQ_VERSION}/jaq-x86_64-unknown-linux-musl" -o /usr/local/bin/jaq
          chmod +x /usr/local/bin/jaq

          GOJQ_VERSION="0.12.17"
          curl -sSL "https://github.com/itchyny/gojq/releases/download/v${GOJQ_VERSION}/gojq_v${GOJQ_VERSION}_linux_amd64.tar.gz" | tar xz
          mv "gojq_v${GOJQ_VERSION}_linux_amd64/gojq" /usr/local/bin/gojq
          chmod +x /usr/local/bin/gojq

      # Baseline cache namespace. Bump the v<N> prefix to invalidate stored
      # baselines when benchmark conditions change (dataset size, pinned
      # tool versions, scenario set, etc.) so ratio comparisons stay valid.
      - name: Restore baseline (regression only)
        if: env.BENCH_MODE == 'regression'
        id: restore-baseline
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/ci-baseline.json
          key: benchmark-baseline-v3-${{ github.ref_name }}-current
          restore-keys: |
            benchmark-baseline-v3-${{ github.ref_name }}-
            benchmark-baseline-v3-main-

      - name: Cache test dataset
        id: cache-data
        uses: actions/cache@v4
        with:
          path: benchmarks/data/huge.jsonl
          key: huge-jsonl-${{ hashFiles('benchmarks/data/huge.generator.sh') }}-${{ env.HUGE_LINES }}

      - name: Cache wide test dataset
        id: cache-data-wide
        uses: actions/cache@v4
        with:
          path: benchmarks/data/huge_wide.jsonl
          key: huge-wide-jsonl-${{ hashFiles('benchmarks/data/huge_wide.generator.sh') }}-${{ env.HUGE_WIDE_LINES }}

      - name: Build zq
        run: zig build -Doptimize=ReleaseFast

      - name: Generate test data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          cd benchmarks/data
          bash huge.generator.sh
          ls -lh huge.jsonl

      - name: Generate wide test data
        if: steps.cache-data-wide.outputs.cache-hit != 'true'
        run: |
          cd benchmarks/data
          bash huge_wide.generator.sh
          ls -lh huge_wide.jsonl

      - name: Run benchmarks
        run: |
          cd benchmarks
          ./run_all.sh

      - name: Validate summary JSON
        run: jq . benchmarks/results/summary.json

      - name: Check regression
        if: env.BENCH_MODE == 'regression'
        run: |
          cd benchmarks
          bash check_regression.sh results/summary.json ci-baseline.json

      - name: Update baseline (main, regression-mode only)
        if: env.BENCH_MODE == 'regression' && github.ref == 'refs/heads/main' && success()
        run: cp benchmarks/results/summary.json benchmarks/ci-baseline.json

      - name: Save baseline
        if: env.BENCH_MODE == 'regression' && github.ref == 'refs/heads/main' && success()
        uses: actions/cache/save@v4
        with:
          path: benchmarks/ci-baseline.json
          key: benchmark-baseline-v3-main-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ env.BENCH_MODE }}-${{ github.sha }}
          path: benchmarks/results/
