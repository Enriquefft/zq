name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig fmt --check src/ tests/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test

  cross-compile:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            rust-target: x86_64-unknown-linux-musl
          - target: aarch64-linux
            rust-target: aarch64-unknown-linux-musl
          - target: x86_64-macos
            rust-target: x86_64-apple-darwin
          - target: aarch64-macos
            rust-target: aarch64-apple-darwin
          - target: x86_64-windows
            rust-target: x86_64-pc-windows-gnu
          - target: x86_64-freebsd
            rust-target: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # The Rust regex shim is cross-compiled via cargo-zigbuild, which drives
      # `zig cc` as the linker. Keep the rust-target entries above in sync with
      # the mapping in build.zig (rustTripleFromTarget) and the fenix targets
      # pulled by flake.nix.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
