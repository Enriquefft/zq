name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig fmt --check src/ tests/

  lint-scripts:
    name: Lint installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Match the PSScriptAnalyzer filter below: warnings + errors only.
      # Info/style findings (e.g. SC2016 on intentional `$PATH` literals in
      # rc-snippet `printf`s) are not actionable lint failures.
      - name: ShellCheck install.sh
        run: shellcheck --severity=warning install.sh
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        # `PSAvoidUsingWriteHost` is a false positive on interactive
        # installers — `Write-Host` is the correct tool for colored
        # progress output that is not pipeline data. `PSUseBOMForUnicode
        # EncodedFile` only fires on decorative non-ASCII glyphs inside
        # comments (no functional impact); PS7 reads UTF-8 fine without
        # a BOM. Both rules are well-known noise for installer scripts.
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 `
            -Severity Warning,Error `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseBOMForUnicodeEncodedFile
          if ($issues) {
            $issues | Format-Table -AutoSize
            exit 1
          }

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            optimize: Debug
          - os: macos
            runner: macos-latest
            optimize: Debug
          - os: windows
            runner: windows-latest
            optimize: Debug
          # Guards BUG-001: mixing extern union inside a non-extern struct
          # only mis-compiles under LLVM TBAA DCE at -O2/-O3. Debug skips it.
          - os: linux
            runner: ubuntu-latest
            optimize: ReleaseSafe
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # Windows host cargo defaults to the MSVC ABI, which emits an archive
      # with a different name (`zq_regex_shim.lib`) than we link against
      # everywhere else (`libzq_regex_shim.a`). build.zig forces the cross
      # path on Windows hosts and invokes cargo-zigbuild with the gnu triple,
      # so the test job needs the same toolchain as the cross-compile job.
      - if: matrix.os == 'windows'
        uses: ./.github/actions/setup-rust-cross
        with:
          rust-target: x86_64-pc-windows-gnu
      # Force the mingw target on Windows so the test binary matches the
      # release artifact (`x86_64-windows-gnu`) exactly. The Rust regex
      # shim is built with cargo-zigbuild against the same triple — see
      # `setup-rust-cross` above. Anonymous pipes in tests use the
      # in-tree `tests/portable_pipe.zig` shim (`std.os.windows.CreatePipe`
      # on Windows), so the test binary needs no libc pipe symbol.
      - if: matrix.os != 'windows'
        run: zig build test -Doptimize=${{ matrix.optimize }}
      - if: matrix.os == 'windows'
        run: zig build test -Dtarget=x86_64-windows-gnu -Doptimize=${{ matrix.optimize }}

  cross-compile:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            rust-target: x86_64-unknown-linux-musl
          - target: aarch64-linux
            rust-target: aarch64-unknown-linux-musl
          - target: x86_64-macos
            rust-target: x86_64-apple-darwin
          - target: aarch64-macos
            rust-target: aarch64-apple-darwin
          - target: x86_64-windows-gnu
            rust-target: x86_64-pc-windows-gnu
          - target: aarch64-windows
            rust-target: aarch64-pc-windows-gnullvm
          - target: x86_64-freebsd
            rust-target: x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # The Rust regex shim is cross-compiled via cargo-zigbuild, which drives
      # `zig cc` as the linker. Keep the rust-target entries above in sync with
      # the mapping in build.zig (rustTripleFromTarget) and the fenix targets
      # pulled by flake.nix.
      - uses: ./.github/actions/setup-rust-cross
        with:
          rust-target: ${{ matrix.rust-target }}
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
