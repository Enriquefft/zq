name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig fmt --check src/ tests/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test

  cross-compile:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [format]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - x86_64-freebsd
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      # -Dregex=false: the Rust shim is built by cargo on the runner (Linux
      # x86_64) and can't natively cross-compile to macOS/Windows/FreeBSD/ARM
      # without a platform SDK. The cross-compile smoke test verifies Zig-code
      # portability across targets; regex-enabled builds get real coverage
      # from `Test (linux)` and `Test (macos)` on native runners.
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe -Dregex=false
